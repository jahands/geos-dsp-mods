name: Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check for mod source
        id: source
        run: |
          if compgen -G 'mods/*/*.csproj' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tooling
        run: bun turbo check:types test
      - name: Build and validate mods
        if: steps.source.outputs.present == 'true'
        run: bun turbo build
      - name: Install Thunderstore CLI
        if: steps.source.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: dotnet tool install --global tcli --version 0.2.4
      - name: Publish new versions
        if: steps.source.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bun runx release
        env:
          THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.source.outputs.present == 'true' && success()
        with:
          name: thunderstore-packages
          path: 'mods/*/dist/*.zip'
          if-no-files-found: error
