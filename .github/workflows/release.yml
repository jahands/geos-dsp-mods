name: Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check for mod source
        id: source
        run: |
          if [ -f scripts/release.py ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.source.outputs.present == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Install Thunderstore CLI
        if: steps.source.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: dotnet tool install --global tcli --version 0.2.4
      - name: Build and validate
        if: steps.source.outputs.present == 'true' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        run: python3 scripts/release.py
      - name: Build, validate, and publish new versions
        if: steps.source.outputs.present == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 scripts/release.py --publish
        env:
          THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.source.outputs.present == 'true' && success()
        with:
          name: thunderstore-packages
          path: "*/dist/*.zip"
          if-no-files-found: error
